<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayHub Knowledge</title>  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+Myanmar:wght@400;600&display=swap" rel="stylesheet">  <style>
    body {
      margin: 0;
      font-family: 'Inter','Noto Sans Myanmar', sans-serif;
      background: #f7f9fc;
      color: #1a1a1a;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #ffffff;
      height: 100vh;
      padding: 20px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.05);
    }

    .sidebar h2 {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .menu-item {
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .menu-item:hover {
      background: #f0f3f7;
    }

    /* Main */
    .main {
      flex: 1;
      padding: 20px;
    }

    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      max-width: 400px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .box {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      transition: 0.2s;
    }

    .box:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .title {
      font-weight: 600;
    }

    .category {
      font-size: 13px;
      color: #777;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      width: 90%;
      max-width: 600px;
      height: 75%;
      border-radius: 14px;
      padding: 20px;
      overflow-y: auto;
    }

    .close {
      float: right;
      cursor: pointer;
      font-size: 20px;
    }

  </style></head>
<body>  <div class="sidebar">
    <h2>PayHub</h2>
    <div class="menu-item">All</div>
    <div class="menu-item">Guide</div>
    <div class="menu-item">Tips</div>
    <div class="menu-item">Info</div>
  </div>  <div class="main"><div class="search-box">
  <input type="text" id="search" placeholder="Search..." onkeyup="filterBoxes()">
</div>

<div class="grid">

  <div class="box" data-title="Game Guide" onclick="openModal('content1')">
    <div class="title">Game Guide</div>
    <div class="category">Guide</div>
  </div>

  <div class="box" data-title="Knowledge Sharing" onclick="openModal('content2')">
    <div class="title">Knowledge Sharing</div>
    <div class="category">Info</div>
  </div>

  <div class="box" data-title="Tips & Tricks" onclick="openModal('content3')">
    <div class="title">Tips & Tricks</div>
    <div class="category">Tips</div>
  </div>

</div>

  </div>  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <div id="modal-text"></div>
    </div>
  </div>  <script>
    const contents = {
      content1: `<h2>Game Guide</h2><p>Game guide content here.</p>`,

      content2: `<h2>Knowledge Sharing</h2><p>
        Shareနဲ့ Private ဘာကွာလဲဆိုရင် —<br><br>
        Share က အများနဲ့သုံးရတာပါ။<br><br>
        Private က mail အသစ် သီးသန့်တခု ပေးမှာပါ။<br><br>
        Own mail က ကိုယ်ပိုင် mail နဲ့ ရမှာပါ။
      </p>`,

      content3: `<h2>Tips & Tricks</h2><p>Tips content here.</p>`
    };

    function openModal(key) {
      document.getElementById('modal-text').innerHTML = contents[key];
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function filterBoxes() {
      const input = document.getElementById('search').value.toLowerCase();
      const boxes = document.querySelectorAll('.box');

      boxes.forEach(box => {
        const title = box.getAttribute('data-title').toLowerCase();
        box.style.display = title.includes(input) ? 'block' : 'none';
      });
    }
  </script></body>
</html>
