<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Promotion Poster</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@400;600;700&display=swap');

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #e9ecef;
        margin: 0;
        font-family: 'Inter', 'Padauk', sans-serif;
    }

    .poster-container {
        width: 360px; /* 9:16 Aspect Ratio Base */
        height: 640px;
        background: linear-gradient(135deg, #fdfefe 0%, #f4f9fc 50%, #fcf4f7 100%);
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        padding: 32px 24px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
    }

    .status-badge {
        align-self: flex-start;
        background: #e8f5e9;
        color: #2e7d32;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 24px;
    }

    .status-badge::before {
        content: '';
        width: 8px;
        height: 8px;
        background-color: #4caf50;
        border-radius: 50%;
        display: inline-block;
    }

    .headline {
        font-size: 20px;
        font-weight: 700;
        color: #111827;
        line-height: 1.5;
        margin-bottom: 12px;
        text-align: left;
    }

    .sub-headline {
        font-size: 16px;
        font-weight: 700;
        color: #4f46e5;
        background: #eef2ff;
        padding: 10px 14px;
        border-radius: 12px;
        margin-bottom: 28px;
        text-align: center;
    }

    .features-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
        flex-grow: 1;
    }

    .feature-item {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
    }

    .feature-item:last-child {
        margin-bottom: 0;
    }

    .icon-box {
        width: 40px;
        height: 40px;
        background: #f8fafc;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .feature-text {
        font-size: 14px;
        font-weight: 600;
        color: #374151;
    }

    .cta-container {
        margin-top: 30px;
    }

    .cta-button {
        width: 100%;
        background: #111827;
        color: white;
        border: none;
        padding: 16px;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(17, 24, 39, 0.2);
        transition: transform 0.2s;
    }

    .cta-button:hover {
        transform: translateY(-2px);
    }
</style>
</head>
<body>

<div class="poster-container">
    <div class="status-badge">Promotion Status: Active</div>
    
    <div class="headline">
        Titok Promote လုပ်ဖို့<br>
        စိတ်ချရတယ့် Service ရှာနေပြီလား။<br>
        ဒါဆိုရင် Gamepay Hubရှိတယ်နော်။
    </div>

    <div class="sub-headline">
        Gamepay Hubမှာ 1$ ကစပြီး Promote လုပ်ရပြီနော်။
    </div>

    <div class="features-card">
        <div class="feature-item">
            <div class="icon-box">👁️</div>
            <div class="feature-text">Get More Video Views</div>
        </div>
        <div class="feature-item">
            <div class="icon-box">❤️</div>
            <div class="feature-text">Get More Likes and Followers</div>
        </div>
        <div class="feature-item">
            <div class="icon-box">👤</div>
            <div class="feature-text">Get More Profile Views</div>
        </div>
    </div>

    <div class="cta-container">
        <button class="cta-button">Start Promote</button>
    </div>
</div>

</body>
</html>
